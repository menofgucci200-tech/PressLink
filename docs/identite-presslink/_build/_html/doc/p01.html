<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>PressLink · Charte graphique</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>
:root{--nuit:#0F172A;--encre:#0B1530;--bleu:#2563EB;--clair:#60A5FA;--ciel:#EFF4FE;--vert:#16A34A;--or:#FBBF24;--fond:#F5F7FC;--gris:#475569;--doux:#64748B;--trait:#E2E8F0;--rouge:#DC2626}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:3.55mm}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--nuit);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{position:relative;width:210mm;height:297mm;overflow:hidden;background:#fff;padding:20mm 18mm 22mm;page-break-after:always;break-after:page}
.pg.sombre{background:var(--encre);color:#fff}
.t,h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;line-height:1.05}
.sur{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bleu)}
h1{font-size:9mm;font-weight:800;margin-top:3mm}
h2{font-size:5.2mm;font-weight:800;margin-top:7mm}
h3{font-size:4.2mm;font-weight:700}
p{margin-top:2.6mm}
.chapo{font-size:1.25rem;line-height:1.5;color:var(--gris);margin-top:4mm}
.petit{font-size:.82rem;color:var(--doux);line-height:1.5}
.pied{position:absolute;left:18mm;right:18mm;bottom:10mm;display:flex;justify-content:space-between;font-size:.72rem;color:#94A3B8;font-weight:600}
.sombre .pied{color:#64748B}
.case{border:.3mm solid var(--trait);border-radius:4mm;display:grid;place-items:center;position:relative;overflow:hidden}
.leg{font-size:.78rem;font-weight:700;color:var(--gris);margin-top:2mm}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
ul.l{list-style:none;margin-top:3mm}
ul.l li{position:relative;padding-left:5mm;margin-top:1.8mm}
ul.l li::before{content:"";position:absolute;left:0;top:1.9mm;width:2mm;height:2mm;border-radius:1mm;background:var(--bleu)}
ul.non li::before{background:var(--rouge)}
table.tb{width:100%;border-collapse:collapse;margin-top:4mm;font-size:.9rem}
table.tb th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--doux);padding:2mm 2mm 2mm 0;border-bottom:.4mm solid var(--nuit)}
table.tb td{padding:2.3mm 2mm 2.3mm 0;border-bottom:.3mm solid var(--trait);vertical-align:top}
.ok,.ko{display:inline-grid;place-items:center;width:5mm;height:5mm;border-radius:50%;color:#fff;font-weight:800;font-size:.7rem}
.ok{background:var(--vert)}.ko{background:var(--rouge)}
.badge{position:absolute;right:3mm;top:3mm}
.encart{background:var(--fond);border-radius:4mm;padding:5mm 6mm;margin-top:5mm}
.num{font-family:'Bricolage Grotesque';font-weight:800;color:var(--bleu)}
@page{size:210mm 297mm;margin:0}
</style></head><body><section class="pg"><p class="sur">Sommaire</p><h1>Contenu</h1><div style="margin-top:10mm"><div style="display:grid;grid-template-columns:16mm 1fr auto;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span></span><span class="t" style="font-size:6mm;font-weight:700">Avant-propos</span><span class="t" style="font-size:4.5mm;color:var(--doux)">03</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">01</span><span class="t" style="font-size:6mm;font-weight:700">La marque</span><span class="t" style="font-size:4.5mm;color:var(--doux)">04</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">02</span><span class="t" style="font-size:6mm;font-weight:700">Le logo</span><span class="t" style="font-size:4.5mm;color:var(--doux)">07</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">03</span><span class="t" style="font-size:6mm;font-weight:700">Les couleurs</span><span class="t" style="font-size:4.5mm;color:var(--doux)">16</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">04</span><span class="t" style="font-size:6mm;font-weight:700">La typographie</span><span class="t" style="font-size:4.5mm;color:var(--doux)">19</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">05</span><span class="t" style="font-size:6mm;font-weight:700">Les éléments graphiques</span><span class="t" style="font-size:4.5mm;color:var(--doux)">22</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">06</span><span class="t" style="font-size:6mm;font-weight:700">La voix</span><span class="t" style="font-size:4.5mm;color:var(--doux)">25</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">07</span><span class="t" style="font-size:6mm;font-weight:700">Le mouvement</span><span class="t" style="font-size:4.5mm;color:var(--doux)">27</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">08</span><span class="t" style="font-size:6mm;font-weight:700">Les applications</span><span class="t" style="font-size:4.5mm;color:var(--doux)">29</span></div><div style="display:grid;grid-template-columns:16mm 1fr auto;align-items:baseline;padding:3.6mm 0;border-bottom:.3mm solid var(--trait)"><span class="num" style="font-size:5mm">09</span><span class="t" style="font-size:6mm;font-weight:700">Les fichiers</span><span class="t" style="font-size:4.5mm;color:var(--doux)">34</span></div></div><div class="pied"><span>PressLink · Charte graphique · Sommaire</span><span>02 / 36</span></div></section></body></html>
