services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage-data:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [presslink]

  # Sert le PHP-FPM ci-dessus en HTTP. En prod réelle, un reverse proxy géré
  # (Nginx du serveur hôte, ou Laravel Cloud) prend souvent cette place —
  # ce service est là pour que la stack tourne de bout en bout localement.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage-data:/var/www/html/storage/app/public:ro
    depends_on: [app]
    networks: [presslink]

  # Notifications en ShouldQueueAfterCommit : sans ce service qui tourne,
  # elles ne partent jamais (cf. checklist de déploiement, §3).
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --tries=3 --backoff=10 --sleep=3
    volumes:
      - storage-data:/var/www/html/storage/app/public
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [presslink]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-presslink}
      MYSQL_USER: ${DB_USERNAME:-presslink}
      MYSQL_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD doit être définie dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?la variable DB_ROOT_PASSWORD doit être définie dans .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [presslink]

volumes:
  mysql-data:
  storage-data:

networks:
  presslink:
