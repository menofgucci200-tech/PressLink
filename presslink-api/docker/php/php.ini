; Réglages de production pour PressLink — au-delà des défauts PHP.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60

; opcache : gain de perf notable en prod, invalidation désactivée
; (le déploiement rebuild l'image à chaque release, pas de hot-reload attendu).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

expose_php = Off
