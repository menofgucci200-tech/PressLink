  <style id="splash-screen-style">
    html, body { height: 100%; margin: 0; background: #FFFFFF; }

    /* Écran de démarrage, affiché dès le premier octet pendant le
       chargement du moteur Flutter : logo fixe (aucune animation coûteuse),
       barre de chargement seulement si le chargement dure. Flutter redessine
       le même logo au même endroit puis retire ce calque (removeSplashFromWeb). */
    #pl-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF;
      transition: opacity .18s ease-out;
    }
    #pl-splash.pl-hide { opacity: 0; pointer-events: none; }
    #pl-splash img { width: 220px; height: auto; display: block; }
    #pl-splash .pl-track {
      margin-top: 28px; width: 120px; height: 3px; border-radius: 3px;
      background: #E2E8F0; overflow: hidden; position: relative;
      opacity: 0; animation: pl-fade .2s ease .8s forwards;
    }
    #pl-splash .pl-bar {
      position: absolute; top: 0; left: 0; width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #2563EB, #06B6D4);
      will-change: transform;
      animation: pl-load 1s cubic-bezier(.65,0,.35,1) infinite;
    }
    @keyframes pl-fade { to { opacity: 1; } }
    @keyframes pl-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #pl-splash .pl-bar { animation: none; }
    }

  <script id="gl-recovery-script">
    // Retour sur l'appli après une mise en arrière-plan (Android surtout) : le
    // système peut retirer à la page sa mémoire graphique (« contexte WebGL »).
    // Le moteur de rendu Flutter ne sait pas la récupérer et l'écran reste
    // noir. On surveille cette perte et on recharge la page au retour : la
    // session étant conservée, l'utilisateur retrouve son accueil.
    (function () {
      var lost = false, reloading = false;
      function reloadWhenVisible() {
        if (reloading) return;
        if (document.visibilityState === 'visible') { reloading = true; setTimeout(function () { location.reload(); }, 150); }
      }
      function onLost() { lost = true; reloadWhenVisible(); }
      document.addEventListener('visibilitychange', function () { if (lost) reloadWhenVisible(); });
      window.addEventListener('pageshow', function (e) { if (e.persisted && lost) reloadWhenVisible(); });
      [window.HTMLCanvasElement, window.OffscreenCanvas].forEach(function (C) {
        if (!C || !C.prototype.getContext) return;
        var original = C.prototype.getContext;
        C.prototype.getContext = function (type) {
          var ctx = original.apply(this, arguments);
          if (ctx && /webgl/i.test(type) && !this.__plWatched) {
            this.__plWatched = true;
            this.addEventListener('webglcontextlost', onLost);
          }
          return ctx;
        };
      });
    })();
  </script>
  <script id="pwa-install-script">
    // Aide à l'installation de la PWA, consommée côté Dart (lib/core/pwa).
    // Android/Chrome : on garde l'événement "beforeinstallprompt" pour
    // pouvoir déclencher l'invite native depuis un bouton de l'app.
    // iOS/Safari : aucune invite n'existe — l'app doit expliquer le geste
    // "Partager > Sur l'écran d'accueil". Tout est évalué à l'appel (pas au
    // chargement) pour refléter l'état réel au moment de l'affichage.
    (function () {
      var deferredPrompt = null;
      var listeners = [];
      function notify() { listeners.forEach(function (cb) { try { cb(); } catch (e) {} }); }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        notify();
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        notify();
      });

      window.presslinkPwa = {
        isStandalone: function () {
          return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true;
        },
        isIosSafari: function () {
          var ua = window.navigator.userAgent || '';
          var isIos = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
          return isIos && isSafari;
        },
        isAndroid: function () { return /Android/i.test(window.navigator.userAgent || ''); },
        canInstall: function () { return deferredPrompt !== null; },
        promptInstall: function () {
          if (!deferredPrompt) return Promise.resolve('unavailable');
          var p = deferredPrompt;
          deferredPrompt = null;
          p.prompt();
          return p.userChoice.then(function (c) { notify(); return c.outcome; });
        },
        onChange: function (cb) { listeners.push(cb); }
      };
    })();
  </script>

  <script id="push-script">
    // Notifications push web (OneSignal), consommées côté Dart
    // (lib/core/notifications/web_push_web.dart). Le SDK charge en différé :
    // chaque appel attend qu'il soit prêt via OneSignalDeferred.
    (function () {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      function withSdk(fn) {
        return new Promise(function (resolve, reject) {
          window.OneSignalDeferred.push(function (OneSignal) {
            Promise.resolve(fn(OneSignal)).then(resolve, reject);
          });
        });
      }
      var ready = null;
      window.presslinkPush = {
        init: function (appId) {
          ready = ready || withSdk(function (OneSignal) {
            return OneSignal.init({
              appId: appId,
              serviceWorkerPath: 'app/push/OneSignalSDKWorker.js',
              serviceWorkerParam: { scope: '/app/push/' },
              allowLocalhostAsSecureOrigin: true
            });
          });
          return ready;
        },
        isSupported: function () {
          return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
        },
        permission: function () {
          return ('Notification' in window) ? Notification.permission : 'unsupported';
        },
        requestPermission: function () {
          return withSdk(function (OneSignal) { return OneSignal.Notifications.requestPermission(); })
            .then(function () { return window.presslinkPush.permission(); });
        },
        subscriptionId: function () {
          return withSdk(function (OneSignal) { return OneSignal.User.PushSubscription.id || ''; });
        },
        onSubscriptionChange: function (cb) {
          withSdk(function (OneSignal) {
            OneSignal.User.PushSubscription.addEventListener('change', function () {
              cb(OneSignal.User.PushSubscription.id || '');
            });
          });
        },
        onClick: function (cb) {
          withSdk(function (OneSignal) {
            OneSignal.Notifications.addEventListener('click', function (e) {
              var data = (e.notification && e.notification.additionalData) || {};
              cb(data.order_id != null ? String(data.order_id) : '');
            });
          });
        },
        onForeground: function (cb) {
          withSdk(function (OneSignal) {
            OneSignal.Notifications.addEventListener('foregroundWillDisplay', function () { cb(); });
          });
        },
        // Interrupteur « Notifications » du profil : OneSignal n'envoie plus
        // rien à ce téléphone (optOut) ou reprend (optIn, qui demande
        // l'autorisation si elle n'a pas encore été donnée).
        setOptedIn: function (enabled) {
          return withSdk(function (OneSignal) {
            return enabled ? OneSignal.User.PushSubscription.optIn() : OneSignal.User.PushSubscription.optOut();
          }).then(function () { return window.presslinkPush.permission(); });
        },
        // Déconnexion : ce téléphone n'est plus rattaché au client.
        logout: function () {
          return withSdk(function (OneSignal) { return OneSignal.logout(); });
        }
      };
    })();
  </script>
  <script id="offline-script">
    // Ouverture hors connexion (hors-connexion-sw.js). Après le premier
    // affichage, on fait garder tout ce que la page a chargé : la prochaine
    // ouverture marchera même sans Internet.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('hors-connexion-sw.js', { scope: './' }).catch(function () {});
      function keepLoadedFiles() {
        navigator.serviceWorker.ready.then(function (registration) {
          if (!registration.active) return;
          var urls = performance.getEntriesByType('resource').map(function (entry) { return entry.name; });
          urls.push(location.href);
          registration.active.postMessage({ type: 'cache-urls', urls: urls });
        });
      }
      window.addEventListener('flutter-first-frame', function () { setTimeout(keepLoadedFiles, 3000); });
    })();
  </script>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var el = document.getElementById("pl-splash");
      if (!el || el.classList.contains("pl-hide")) return;
      el.classList.add("pl-hide");
      setTimeout(function () { el.remove(); }, 200);
    }
    // Normalement appelé par Flutter dès que son logo est dessiné ; filet de
    // sécurité si ce signal n'arrive jamais.
    window.addEventListener("flutter-first-frame", function () {
      setTimeout(removeSplashFromWeb, 1500);
    });
  </script>
